name: Build and test

on:
  push:
  pull_request:

jobs:
  formatting:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format-18
      - name: Check C sources and headers
        run: git ls-files -z '*.c' '*.h' | xargs -0 clang-format-18 --dry-run --Werror

  linux:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        mode: [release, sanitizers]
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libsqlite3-dev libncurses-dev libcrypt-dev python3
      - name: Build
        run: |
          if [ "${{ matrix.mode }}" = release ]; then
            make -j2 SAN=
          else
            make -j2
          fi
      - name: Test
        run: |
          if [ "${{ matrix.mode }}" = release ]; then
            make SAN= check
          else
            make check
          fi
      - name: Exercise terminal input and resize
        if: hashFiles('tests/client/test_terminal.py') != ''
        run: python3 tests/client/test_terminal.py
      - name: Exercise password-protected servers
        run: |
          python3 tests/server/test_server_password.py
          CUPIDCHAT_TEST_LOCKED=1 python3 tests/client/test_terminal.py
